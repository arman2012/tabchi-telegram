[project]
name = "telegram-campaign-manager"
version = "0.1.0"
description = "Local Windows Telegram campaign dashboard"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "telethon==1.45.0",
  "python-multipart>=0.0.20,<1",
  "pillow>=11,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
